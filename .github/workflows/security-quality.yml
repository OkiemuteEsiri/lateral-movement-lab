name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic assessment
        run: python -m src.cli --events data/synthetic_events.json --output reports/generated-assessment.md
      - name: Validate expected defensive content
        run: |
          grep -q "MITRE ATT&CK" reports/generated-assessment.md
          grep -q "T1021" reports/generated-assessment.md
